[build-system]
requires = ["setuptools>=77,<83", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-trend-environment"
version = "0.1.0"
description = "Dependency environment for the repository-local stock-trend skill"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6,<2.3",
    "pandas>=2.3.3,<2.4",
    "requests>=2.33.1,<3",
    "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
market = ["akshare>=1.18.63,<2"]
tushare = ["tushare>=1.4,<2"]
baostock = ["baostock>=0.8,<1"]
hk = ["yfinance>=0.2,<2"]
test = ["pytest>=8,<10", "packaging>=24,<27", "tomli>=2,<3; python_version < '3.11'"]
all = ["stock-trend-environment[market,tushare,baostock,hk,test]"]

# This installs dependency metadata only. Scripts remain repository-local;
# no reports, caches, skill resources or generic top-level packages are shipped.
[tool.setuptools]
packages = []
include-package-data = false
